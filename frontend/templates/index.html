<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orel Eye - Multi-View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      /* Dark mode for CCTV feel */
      color: #e0e0e0;
    }

    .navbar {
      background-color: #1f1f1f !important;
      border-bottom: 1px solid #333;
    }

    .brand-text {
      font-weight: bold;
      letter-spacing: 1px;
    }

    .camera-card {
      background-color: #1f1f1f;
      border: 1px solid #333;
      margin-bottom: 20px;
      border-radius: 8px;
      overflow: hidden;
    }

    .camera-card-header {
      padding: 10px 15px;
      background-color: #2c2c2c;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .camera-title {
      font-weight: 500;
      margin: 0;
      font-size: 1rem;
    }

    .live-indicator {
      height: 10px;
      width: 10px;
      background-color: #dc3545;
      /* Red for recording/live */
      border-radius: 50%;
      box-shadow: 0 0 5px #dc3545;
      display: inline-block;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      /* 16:9 Aspect Ratio */
      padding-top: 56.25%;
      background: #000;
    }

    .video-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* Ensure full video is seen */
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1 brand-text">
        <span class="text-primary">OREL</span> EYE
      </span>
      <div>
        <button class="btn btn-sm btn-outline-light me-2 active" onclick="filterCams('all')">All Feeds</button>
        <button class="btn btn-sm btn-outline-success me-2" onclick="filterCams('working')">Working Areas</button>
        <button class="btn btn-sm btn-outline-warning" onclick="filterCams('non-working')">Non-Working Areas</button>
      </div>
    </div>
  </nav>

  <!-- Main Grid -->
  <div class="container-fluid">
    <div class="row" id="camGrid">
      {% for cam in cameras %}
      <div class="col-md-6 col-lg-4 col-xl-3 cam-col" data-category="{{ cam.category }}">
        <div class="camera-card">
          <div class="camera-card-header">
            <h5 class="camera-title">{{ cam.name }}</h5>
            <span class="live-indicator" title="Live"></span>
          </div>
          <div class="video-wrapper">
            <img src="{{ url_for('video_feed', camera_id=cam.id) }}" class="video-feed" alt="{{ cam.name }}">
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function filterCams(type) {
      const cols = document.querySelectorAll('.cam-col');
      const buttons = document.querySelectorAll('.btn');

      // Update active button state
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      cols.forEach(col => {
        if (type === 'all' || col.getAttribute('data-category') === type) {
          col.style.display = 'block';
        } else {
          col.style.display = 'none';
        }
      });
    }
    // Simple keep-alive or reload logic if needed in future
    console.log("Orel Eye Dashboard Loaded");
  </script>
</body>

</html>
